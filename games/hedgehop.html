<title>Hedgehop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Sniglet:wght@400;800&display=swap">
<style>
/* Layout: one full-bleed canvas column climbing the forest; a hanging wooden sign HUD up top, steering pads in the bottom corners */
:root {
  --wood-hi: #dc9d5c;
  --wood-lo: #9a5a28;
  --wood-dark: #4a2812;
  --cream: #fff3d1;
  --leaf-hi: #a6e468;
  --leaf: #52a62e;
  --leaf-dark: #1f4a14;
  --gold-hi: #ffe27a;
  --gold: #f0a92a;
  --gold-dark: #6a3e08;
  --shade: rgba(16, 26, 10, .55);
  --font-sign: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Sniglet", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; background: #24452b; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; background: #24452b; color: var(--cream);
  font-family: var(--font-body); font-size: 15px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

/* wood surface shared by signs, buttons and panels */
.plank {
  border: 3px solid var(--wood-dark);
  background:
    radial-gradient(circle at 10px 10px, #5b3418 2px, transparent 2.7px),
    radial-gradient(circle at calc(100% - 10px) 10px, #5b3418 2px, transparent 2.7px),
    repeating-linear-gradient(180deg, transparent 0 14px, rgba(74, 40, 18, .2) 14px 15.5px),
    linear-gradient(var(--wood-hi), var(--wood-lo));
  box-shadow: inset 0 2px 0 rgba(255, 230, 180, .5), inset 0 -3px 0 rgba(74, 40, 18, .3), 0 4px 0 var(--wood-dark), 0 10px 18px rgba(10, 6, 0, .35);
  color: var(--cream);
  text-shadow: 0 2px 0 var(--wood-dark);
}

/* HUD */
#hud {
  position: absolute; left: 0; right: 0; top: 0;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
  padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.chip {
  justify-self: start; margin-top: 12px;
  display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 5px;
  border-radius: 999px; background: rgba(36, 20, 8, .55); border: 2px solid rgba(255, 243, 209, .22);
  font-family: var(--font-sign); font-size: 18px; text-shadow: 0 2px 0 rgba(0, 0, 0, .35);
  font-variant-numeric: tabular-nums;
}
.chip svg { width: 26px; height: 26px; flex: none; }
.chip.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.18); } }
.sign {
  justify-self: center; position: relative; margin-top: 4px;
  display: flex; flex-direction: column; align-items: center; min-width: 124px; padding: 5px 16px 7px;
  border-radius: 12px; font-family: var(--font-sign); transform: rotate(-1.5deg);
}
.sign::before, .sign::after {
  content: ""; position: absolute; top: -26px; width: 3px; height: 24px; border-radius: 2px;
  background: linear-gradient(#d8b47a, #7a5a34);
}
.sign::before { left: 22px; }
.sign::after { right: 22px; }
.sign-num { font-size: 22px; line-height: 1.05; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.sign-name { font-family: var(--font-body); font-weight: 800; font-size: 12.5px; letter-spacing: .03em; line-height: 1.2; white-space: nowrap; }

.btn-wood {
  display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px;
  border: 3px solid var(--wood-dark);
  background: linear-gradient(var(--wood-hi), var(--wood-lo));
  box-shadow: inset 0 2px 0 rgba(255, 230, 180, .55), inset 0 -3px 0 rgba(74, 40, 18, .3), 0 4px 0 var(--wood-dark);
  color: var(--cream); transition: transform .06s;
}
.btn-wood svg { width: 26px; height: 26px; filter: drop-shadow(0 2px 0 var(--wood-dark)); }
.btn-wood:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255, 230, 180, .55), inset 0 -3px 0 rgba(74, 40, 18, .3), 0 1px 0 var(--wood-dark); }
.btn-wood.small { justify-self: end; margin-top: 8px; width: 44px; height: 44px; border-radius: 14px; pointer-events: auto; }
.btn-wood.small svg { width: 22px; height: 22px; }
.btn-go {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 132px; height: 60px; padding: 0 26px; border-radius: 999px;
  border: 3px solid var(--leaf-dark);
  background: linear-gradient(var(--leaf-hi), var(--leaf));
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, .45), inset 0 -4px 0 rgba(0, 0, 0, .16), 0 5px 0 var(--leaf-dark);
  font-family: var(--font-sign); font-size: 26px; color: #fff; text-shadow: 0 2px 0 var(--leaf-dark);
  transition: transform .06s;
}
.btn-go svg { width: 22px; height: 22px; filter: drop-shadow(0 2px 0 var(--leaf-dark)); }
.btn-go:active { transform: translateY(4px); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .45), inset 0 -4px 0 rgba(0, 0, 0, .16), 0 1px 0 var(--leaf-dark); }

/* steering pads: touch screens only, they light up while held */
.pad {
  position: absolute; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%;
  background: rgba(36, 20, 8, .3); border: 2px solid rgba(255, 243, 209, .22); color: var(--cream);
  pointer-events: none; transition: transform .08s, background-color .08s;
}
#pad-l { left: max(16px, env(safe-area-inset-left, 0px)); }
#pad-r { right: max(16px, env(safe-area-inset-right, 0px)); }
.pad svg { width: 28px; height: 28px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .35)); }
.pad.on { background: rgba(36, 20, 8, .62); transform: scale(.92); }
@media (hover: hover) and (pointer: fine) { .pad { display: none; } }

#hint, .tip {
  width: max-content; max-width: min(320px, calc(100% - 32px)); padding: 7px 14px; border-radius: 14px;
  background: rgba(30, 18, 6, .6); font-weight: 800; font-size: 14px; line-height: 1.3; text-align: center;
  text-wrap: balance;
}
#hint {
  position: absolute; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  pointer-events: none; transition: opacity .35s;
}
#hint.gone { opacity: 0; }
.tip { margin: 0; }

#toast {
  position: absolute; left: 50%; top: 30%; padding: 10px 20px; border-radius: 14px;
  font-family: var(--font-sign); font-size: 22px; white-space: nowrap; pointer-events: none;
  opacity: 0; transform: translate(-50%, -14px) rotate(-3deg) scale(.9);
  transition: opacity .18s, transform .3s cubic-bezier(.3, 1.6, .5, 1);
}
#toast.show { opacity: 1; transform: translate(-50%, 0) rotate(-3deg) scale(1); }

/* overlays */
.overlay {
  position: absolute; inset: 0; overflow: auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 45%, rgba(12, 22, 8, .12), rgba(12, 22, 8, .62));
}
.panel { position: relative; width: min(360px, 100%); padding: 22px 20px 20px; border-radius: 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--font-sign); font-weight: 400; font-size: 32px; line-height: 1.05; text-wrap: balance; }
.panel p { margin: 0; font-weight: 800; font-size: 15px; line-height: 1.35; text-wrap: balance; text-shadow: 0 1px 0 var(--wood-dark); }

#title { justify-content: space-between; padding-block: 48px 40px; }
.logo {
  margin: 0; text-align: center; font-family: var(--font-sign); font-weight: 400;
  font-size: clamp(56px, 18vw, 92px); line-height: .9; color: #ffe7a0; letter-spacing: .01em;
  transform: rotate(-4deg);
  text-shadow:
    3px 0 0 #3a200c, -3px 0 0 #3a200c, 0 3px 0 #3a200c, 0 -3px 0 #3a200c,
    2px 2px 0 #3a200c, -2px 2px 0 #3a200c, 2px -2px 0 #3a200c, -2px -2px 0 #3a200c,
    0 8px 0 #3a200c, 0 14px 24px rgba(0, 0, 0, .4);
}
.logo span { display: block; color: #b6f07a; padding-left: .55em; }
.tagline { margin: 18px 0 0; padding: 6px 16px; border-radius: 12px; font-family: var(--font-sign); font-size: 17px; letter-spacing: .02em; transform: rotate(2deg); width: max-content; max-width: 100%; text-align: center; }
.title-top { display: flex; flex-direction: column; align-items: center; }
.title-actions { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.title-actions .btn-go { min-width: 190px; height: 66px; font-size: 30px; }
.title-row { display: flex; gap: 12px; align-items: center; }
.best-tag {
  display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 18px 0 12px; border-radius: 16px;
  font-family: var(--font-sign); font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.best-tag svg { width: 26px; height: 26px; flex: none; }

.ribbon {
  position: absolute; top: -18px; left: 50%; transform: translateX(-50%) rotate(-4deg);
  padding: 4px 16px; border-radius: 10px; white-space: nowrap;
  border: 3px solid var(--gold-dark); background: linear-gradient(var(--gold-hi), var(--gold));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .5), 0 3px 0 var(--gold-dark);
  font-family: var(--font-sign); font-size: 19px; color: #fff; text-shadow: 0 2px 0 var(--gold-dark);
  animation: pop .5s .2s cubic-bezier(.3, 1.8, .5, 1) both;
}
@keyframes pop { from { transform: translateX(-50%) scale(0) rotate(-30deg); } to { transform: translateX(-50%) rotate(-4deg); } }
.res-height {
  font-family: var(--font-sign); font-size: 66px; line-height: .9; color: #ffe7a0; font-variant-numeric: tabular-nums;
  text-shadow: 2px 0 0 #3a200c, -2px 0 0 #3a200c, 0 2px 0 #3a200c, 0 -2px 0 #3a200c, 0 5px 0 #3a200c;
}
.res-height small { font-size: 30px; }
.res-stats { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.stat {
  display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 6px; border-radius: 999px;
  background: rgba(36, 20, 8, .45); border: 2px solid rgba(255, 243, 209, .2);
  font-family: var(--font-sign); font-size: 17px; text-shadow: 0 2px 0 rgba(0, 0, 0, .35); font-variant-numeric: tabular-nums;
}
.stat svg { width: 24px; height: 24px; flex: none; }
.res-row { display: flex; gap: 12px; align-items: center; justify-content: center; }
.res-row .btn-go { min-width: 132px; }

@media (prefers-reduced-motion: reduce) {
  .chip.bump, .ribbon { animation: none; }
  #toast { transition: opacity .18s; }
}
</style>

<div id="app">
  <canvas id="stage" aria-label="A hedgehog bouncing up through the forest. Hold left or right to steer."></canvas>

  <div id="hud" hidden>
    <div class="chip" id="berry-chip" aria-label="Berries collected">
      <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-berry"/></svg><span id="berry-count">0</span>
    </div>
    <div class="sign plank"><span class="sign-num" id="height-num">0 m</span><span class="sign-name" id="zone-name">Morning Glade</span></div>
    <button class="btn-wood small" id="btn-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><use href="#i-pause"/></svg></button>
  </div>

  <div id="pads" hidden aria-hidden="true">
    <div class="pad" id="pad-l"><svg viewBox="0 0 24 24"><use href="#i-left"/></svg></div>
    <div class="pad" id="pad-r"><svg viewBox="0 0 24 24"><use href="#i-right"/></svg></div>
  </div>

  <div id="hint" class="gone"></div>
  <div id="toast" class="plank" role="status" aria-live="polite"></div>

  <div id="title" class="overlay">
    <div class="title-top">
      <h1 class="logo">Hedge<span>hop</span></h1>
      <p class="tagline plank">Hop branch to branch. Don't look down.</p>
    </div>
    <div class="title-actions">
      <button class="btn-go" id="btn-play"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg><span>Play</span></button>
      <div class="title-row">
        <div class="best-tag plank" id="title-best" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flag"/></svg><span id="title-best-num">Best 0 m</span></div>
        <button class="btn-wood" id="btn-sound" aria-label="Sound on"><svg viewBox="0 0 24 24"><use href="#i-sound" class="sound-use"/></svg></button>
      </div>
      <p class="tip" id="title-tip"></p>
    </div>
  </div>

  <div id="pause" class="overlay" hidden>
    <div class="panel plank">
      <h2>Catching his breath</h2>
      <p id="pause-text"></p>
      <div class="res-row">
        <button class="btn-wood" id="btn-quit" aria-label="Back to the title"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg></button>
        <button class="btn-go" id="btn-resume"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg><span>Resume</span></button>
        <button class="btn-wood" id="btn-sound2" aria-label="Sound on"><svg viewBox="0 0 24 24"><use href="#i-sound" class="sound-use"/></svg></button>
      </div>
    </div>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="panel plank">
      <span class="ribbon" id="res-best" hidden>New best!</span>
      <h2 id="res-title">Tumbled down!</h2>
      <div class="res-height"><span id="res-m">0</span><small> m</small></div>
      <div class="res-stats">
        <span class="stat"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-berry"/></svg><span id="res-berries">0 berries</span></span>
        <span class="stat"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flag"/></svg><span id="res-record">Best 0 m</span></span>
      </div>
      <p id="res-tip"></p>
      <div class="res-row">
        <button class="btn-wood" id="btn-home" aria-label="Back to the title"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg></button>
        <button class="btn-go" id="btn-again"><svg viewBox="0 0 24 24"><use href="#i-retry"/></svg><span>Again</span></button>
      </div>
    </div>
  </div>
</div>

<script id="core">
// Physics and world generation. No DOM in here, so runs can be simulated headlessly.
// World units: the column is W wide, y grows downward, the forest floor is y = 0 and the climb goes negative.
const Core = (() => {
  const W = 420, R = 16, GRAV = 1500, JUMP = 790, CAP_JUMP = 1420, VX = 360, AX = 3000, FRIC = 3400;
  const FLOAT_T = 2.4, FLOAT_V = 1050, DRAFT_A = 2900, DRAFT_V = 980;
  const BRANCH_H = 7, CAP_TOP = 40, CAP_HW = 26, M = 10;
  const ZONES = [
    { name: 'Morning Glade', at: 0 },
    { name: 'Amber Hollow', at: 3500 },
    { name: 'Firefly Night', at: 9000 },
  ];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, k) => a + (b - a) * k;

  // the random state lives on the run so a run can be snapshotted as plain data
  function rand(s) {
    s.rs = (s.rs + 0x6D2B79F5) | 0;
    let t = Math.imul(s.rs ^ (s.rs >>> 15), 1 | s.rs);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function wrapDx(a, b) { let d = a - b; if (d > W / 2) d -= W; else if (d < -W / 2) d += W; return d; }
  const overlaps = (a, b, c, d) => b > c && a < d;
  const overlapsWrap = (a, b, c, d) => overlaps(a, b, c, d) || overlaps(a, b, c - W, d - W) || overlaps(a, b, c + W, d + W);

  function makeRun(seed, viewH = 760) {
    const s = {
      rs: seed | 0, nid: 1, t: 0, viewH, camTop: 130 - viewH,
      p: { x: 124, y: -R, vx: 0, vy: 0, face: 1, sq: 0, flip: 0, float: 0, draft: false },
      plats: [{ id: 0, kind: 'ground', x: W / 2, y: 0, w: W * 4, vx: 0, vy: 0, sq: 0, broken: false, fallT: 0 }],
      haz: [], items: [], drafts: [], cols: [],
      genY: -60, main: null, maxH: 0, berries: 0, pops: 0,
      last: { wasp: 0, puff: 0, draft: 0 }, result: null, events: [],
    };
    s.main = s.plats[0];
    gen(s);
    return s;
  }

  function addPlat(s, kind, y, d, avoid) {
    const w = kind === 'cap' ? 74 : kind === 'raft' ? 80 - 10 * d : kind === 'twig' ? 72 - 10 * d : 88 - 24 * d;
    const pick = () => w / 2 + 6 + rand(s) * (W - w - 12);
    let x = pick();
    if (avoid) for (let k = 0; k < 6 && Math.abs(wrapDx(x, avoid.x)) < (w + avoid.w) / 2 + 30; k++) x = pick();
    const q = { id: s.nid++, kind, x, y, w, vx: 0, vy: 0, sq: 0, broken: false, fallT: 0 };
    if (kind === 'raft') q.vx = (rand(s) < 0.5 ? -1 : 1) * (45 + 75 * d + rand(s) * 30);
    if (kind === 'cap') s.cols.push({ x0: x - CAP_HW - R - 24, x1: x + CAP_HW + R + 24, y0: y - 760, y1: y });
    s.plats.push(q);
    return q;
  }

  function addBramble(s, by, h, d, prev, next) {
    if (prev.kind === 'raft' || next.kind === 'raft') return;
    const bw = 58 + rand(s) * 40, roam = h > 6000 && rand(s) < 0.4 ? 40 : 0;
    // keep the straight run between the two footholds clear

let toastTimer = 0;

}
const STEER_TEXT = touchFirst ? 'Hold the left or right side to steer' : 'Steer with the arrow keys or A and D';

// ---------- flow ----------
function newRun() {
  G.run = Core.makeRun((Math.random() * 2 ** 31) | 0, VHW);
  G.mode = 'idle'; G.fx = []; G.fall = null; G.happyT = 0;
}
function show(screen) {
  G.screen = screen;
  $('title').hidden = screen !== 'title';
  $('pause').hidden = screen !== 'pause';
  $('result').hidden = screen !== 'result';
  hud.hidden = !(screen === 'play' || screen === 'pause');
  pads.hidden = screen !== 'play';
  if (screen !== 'play') hint.classList.add('gone');
  if (screen === 'title') {
    $('title-best').hidden = best <= 0;
    $('title-best-num').textContent = `Best ${best} m`;
  }
}
function startRun() {
  if (!G.run || G.mode !== 'idle') newRun();
  const run = G.run;
  G.mode = 'run'; G.paused = false; acc = 0;
  G.prevBest = best; G.bestToast = false; G.steered = false;
  run.p.vy = -Core.JUMP; run.p.sq = 1;
  show('play'); resetHud(); showHint(); sfx.start();
  cv.focus({ preventScroll: true });
}
function setPaused(on) {
  if (on && (G.screen !== 'play' || G.mode !== 'run')) return;
  if (!on && G.screen !== 'pause') return;
  G.paused = on; held.clear(); keys.l = keys.r = false;
  if (on) {
    const m = Math.floor(G.run.maxH / M), b = G.run.berries;
    $('pause-text').textContent = `${m} m climbed and ${b} ${b === 1 ? 'berry' : 'berries'} so far.`;
    show('pause'); $('btn-resume').focus({ preventScroll: true });
  } else { show('play'); last = performance.now(); cv.focus({ preventScroll: true }); }
}

const DEATH = {
  fall: 'Tumbled down!', thorns: 'Ouch! Brambles.', wasp: 'Stung by a wasp!',
};
const TIPS = {
  fall: [
    'Purple caps throw him extra high.',
    'Dry twig bundles snap after one hop.',
    'Run off one side to pop out the other.',
    'Dandelions carry him straight up for a moment.',
    'Rising air in the dashed columns gives a free lift.',
  ],
  thorns: ['Brambles sting. Steer around the purple vines.'],
  wasp: ['Land on a wasp from above to pop it.'],
};
function onEnd(r) {
  const p = G.run.p;
  G.mode = 'over'; G.overT = 0; G.cause = r;
  G.fall = { x: p.x, y: p.y, vx: p.vx * 0.3, vy: r === 'fall' ? p.vy : -520, ang: 0, spin: r === 'fall' ? 0 : (p.vx >= 0 ? 7 : -7) };
  buzz(r === 'fall' ? 40 : 80);
  if (r === 'fall') sfx.fall();
  else {
    sfx.ouch();
    for (let k = 0; k < 12; k++) G.fx.push({ kind: 'puff', x: p.x, y: p.y, vx: (Math.random() - 0.5) * 180, vy: (Math.random() - 0.5) * 180, life: 0, max: 0.6 });
  }
  hint.classList.add('gone');
}
function showResult() {
  const run = G.run, m = Math.floor(run.maxH / M), isBest = m > best && m > 0;
  if (isBest) { best = m; store.set('hedgehop.best', best); }
  $('res-title').textContent = DEATH[G.cause] || 'Tumbled down!';
  $('res-m').textContent = `${m}`;
  $('res-berries').textContent = `${run.berries} ${run.berries === 1 ? 'berry' : 'berries'}`;
  $('res-record').textContent = `Best ${best} m`;
  $('res-best').hidden = !isBest;
  const pool = TIPS[G.cause] || TIPS.fall;
  $('res-tip').textContent = pool[Math.floor(Math.random() * pool.length)];

// ---------- steering input ----------
const keys = { l: false, r: false };
const held = new Map();
let lastPointer = null;
function sideOf(e) { const rc = cv.getBoundingClientRect(); return e.clientX - rc.left < rc.width / 2 ? -1 : 1; }
function steerDir() {
  const k = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  if (keys.l || keys.r) return k;
  if (lastPointer != null && held.has(lastPointer)) return held.get(lastPointer);
  for (const v of held.values()) return v;
  return 0;
}
cv.addEventListener('pointerdown', (e) => {
  if (G.screen !== 'play') return;
  audio();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture unsupported */ }
  held.set(e.pointerId, sideOf(e)); lastPointer = e.pointerId;
  e.preventDefault();
});
cv.addEventListener('pointermove', (e) => { if (held.has(e.pointerId)) held.set(e.pointerId, sideOf(e)); });
const release = (e) => { held.delete(e.pointerId); if (lastPointer === e.pointerId) lastPointer = null; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.l = true; if (G.screen === 'play') e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.r = true; if (G.screen === 'play') e.preventDefault(); }
  else if (k === 'Escape' || k === 'p' || k === 'P') { if (G.screen === 'play') setPaused(true); else if (G.screen === 'pause') setPaused(false); }
  else if ((k === ' ' || k === 'Enter') && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) {
    if (G.screen === 'title' || G.screen === 'result') { e.preventDefault(); audio(); startRun(); }
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
});
window.addEventListener('blur', () => { keys.l = keys.r = false; held.clear(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

// ---------- ambient ----------
function initMotes() {
  const r = rng(77);
  G.motes = [];
  for (let i = 0; i < 18; i++) G.motes.push({ x: r(), y: r() * H, ph: r() * TAU, sp: 0.5 + r(), s: 0.7 + r() * 0.6 });
}
function updateMotes(dt, dCam, th) {
  const fall = th.w[1];
  for (const m of G.motes) {
    m.ph += dt * m.sp;
    m.y -= dCam * 0.55;
    m.y += dt * (26 * m.sp * fall + Math.cos(m.ph * 0.5) * 7 * (1 - fall) - 4 * th.w[0]);
    m.x += (Math.sin(m.ph * (fall > 0.5 ? 1.3 : 0.7)) * dt * (10 + 20 * fall)) / Math.max(1, view.x1 - view.x0);
    if (m.y > VHW + 20) { m.y -= VHW + 40; m.x = Math.random(); }
    else if (m.y < -20) { m.y += VHW + 40; m.x = Math.random(); }
  }
}
function drawMotes(c, th) {
  const { x0, x1 } = view;
  for (const m of G.motes) {
    const x = x0 + (((m.x % 1) + 1) % 1) * (x1 - x0), y = m.y;
    if (th.w[0] > 0.02) { c.globalAlpha = (0.35 + 0.35 * Math.sin(m.ph * 1.7)) * th.w[0]; c.drawImage(glowOf('#fffbd8'), x - 7, y - 7, 14, 14); }
    if (th.w[1] > 0.02) { c.globalAlpha = th.w[1]; drawLeaf(c, x, y, m.ph * 1.5, 6 * m.s, th.canopy[2], th.line); }
    if (th.w[2] > 0.02) {
      c.globalAlpha = (0.35 + 0.65 * Math.max(0, Math.sin(m.ph * 2.2))) * th.w[2];
      c.drawImage(glowOf('#e9ff8a'), x - 14, y - 14, 28, 28);
      c.fillStyle = '#fbffd0'; c.beginPath(); c.arc(x, y, 1.8, 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
  }
}

// ---------- drawing helpers ----------
function blobs(c, list, colors, line, lw) {
  c.fillStyle = line;
  c.beginPath(); for (const [x, y, r] of list) { c.moveTo(x + r + lw, y); c.arc(x, y, r + lw, 0, TAU); } c.fill();
  c.fillStyle = colors[0];
  c.beginPath(); for (const [x, y, r] of list) { c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); } c.fill();
  if (colors[1]) { c.fillStyle = colors[1]; c.beginPath(); for (const [x, y, r] of list) { c.moveTo(x - r * 0.12 + r * 0.72, y - r * 0.2); c.arc(x - r * 0.12, y - r * 0.2, r * 0.72, 0, TAU); } c.fill(); }
  if (colors[2]) { c.fillStyle = colors[2]; c.beginPath(); for (const [x, y, r] of list) { c.moveTo(x - r * 0.3 + r * 0.32, y - r * 0.38); c.arc(x - r * 0.3, y - r * 0.38, r * 0.32, 0, TAU); } c.fill(); }
}
function drawLeaf(c, x, y, a, s, fill = '#7fd14c', line = '#1d3a14') {
  c.save(); c.translate(x, y); c.rotate(a);
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(s * 0.6, -s * 0.62, s * 1.5, 0); c.quadraticCurveTo(s * 0.6, s * 0.62, 0, 0); c.closePath();
  c.fillStyle = fill; c.fill(); c.lineWidth = 1.6; c.strokeStyle = line; c.stroke();
  c.beginPath(); c.moveTo(s * 0.18, 0); c.lineTo(s * 1.1, 0); c.strokeStyle = 'rgba(30,70,20,.5)'; c.lineWidth = 1; c.stroke();
  c.restore();
}

// ---------- backdrop (screen space, in world units) ----------
function drawSky(c, th, t) {
  const { x0, x1 } = view, hgt = VHW;
  const sky = c.createLinearGradient(0, 0, 0, hgt);
  th.sky.forEach((col, i) => sky.addColorStop(i / (th.sky.length - 1), col));
  c.fillStyle = sky; c.fillRect(x0 - 2, -2, x1 - x0 + 4, hgt + 4);
  const sunX = x1 - 80, sunY = 150;
  const gl = c.createRadialGradient(sunX, sunY, 0, sunX, sunY, 420);
  gl.addColorStop(0, th.glow); gl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = gl; c.fillRect(x0, 0, x1 - x0, hgt);
  if (th.night > 0.01) {
    c.globalAlpha = th.night;
    c.fillStyle = '#fff';
    for (const [sx, sy, sr, ph] of scene.stars) {
      c.globalAlpha = th.night * (reduceMotion ? 0.75 : 0.5 + 0.35 * Math.sin(t * 1.7 + ph));
      c.beginPath(); c.arc(sx, sy, sr, 0, TAU); c.fill();
    }
    c.globalAlpha = th.night;
    c.fillStyle = '#f4f0d6'; c.beginPath(); c.arc(sunX, sunY, 26, 0, TAU); c.fill();
    c.fillStyle = 'rgba(200,196,170,.6)';
    c.beginPath(); c.arc(sunX - 8, sunY - 6, 5, 0, TAU); c.arc(sunX + 9, sunY + 7, 4, 0, TAU); c.arc(sunX + 4, sunY - 11, 2.6, 0, TAU); c.fill();
    c.globalAlpha = 1;
  }
  c.fillStyle = th.far;
  for (const [x, w] of scene.far) { c.beginPath(); c.moveTo(x - w / 2, -2); c.lineTo(x + w / 2, -2); c.lineTo(x + w / 2 + 5, hgt + 2); c.lineTo(x - w / 2 - 5, hgt + 2); c.fill(); }
  c.fillStyle = th.haze; c.fillRect(x0, 0, x1 - x0, hgt);
  for (const [tx, w, skew] of scene.rays) {
    const rg = c.createLinearGradient(0, 0, 0, hgt);
    rg.addColorStop(0, th.ray); rg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = rg;
    c.beginPath(); c.moveTo(tx, 0); c.lineTo(tx + w, 0); c.lineTo(tx + w - skew, hgt); c.lineTo(tx - skew - w * 0.6, hgt); c.fill();
  }
}

// mid trunks scroll at about half speed, with boughs and bark that repeat in slots
function drawTrunks(c, th, camTop) {
  const off = camTop * 0.45, hgt = VHW;
  for (const tr of scene.trunks) {
    const n0 = Math.floor((off - 200) / 380), n1 = Math.ceil((off + hgt + 200) / 380);
    for (let n = n0; n <= n1; n++) {
      const r = rng(n * 7919 + tr.k * 104729 + 3);
      if (r() < 0.45) continue;
      const side = r() < 0.5 ? -1 : 1, by = n * 380 + r() * 120 - off, len = 50 + r() * 70;
      const bx = tr.x + side * tr.w * 0.4, ex = bx + side * len, ey = by - 18 - r() * 26;
      c.globalAlpha = 0.8;
      c.lineCap = 'round';
      c.strokeStyle = th.line; c.lineWidth = 11; c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(bx + side * len * 0.5, by, ex, ey); c.stroke();
      c.strokeStyle = th.midDark; c.lineWidth = 6.5; c.stroke();
      const cl = [];
      for (let k = 0; k < 6; k++) cl.push([ex + (r() - 0.5) * 46, ey + (r() - 0.6) * 28, 12 + r() * 12]);
      blobs(c, cl, [th.canopy[0], th.canopy[1]], th.line, 3);
      c.globalAlpha = 1;
    }
    const wav = (yy) => Math.sin((yy + off) * 0.012 + tr.ph) * 4;
    c.beginPath();
    for (let y = -40; y <= hgt + 40; y += 40) { const xx = tr.x - tr.w / 2 + wav(y); y === -40 ? c.moveTo(xx, y) : c.lineTo(xx, y); }
    for (let y = Math.floor((hgt + 40) / 40) * 40; y >= -40; y -= 40) c.lineTo(tr.x + tr.w / 2 + wav(y + 70), y);
    c.closePath();
    c.fillStyle = th.mid; c.fill(); c.strokeStyle = th.line; c.globalAlpha = 0.55; c.lineWidth = 3; c.stroke(); c.globalAlpha = 1;
    c.strokeStyle = th.midDark; c.lineWidth = 2.2;
    const m0 = Math.floor((off - 160) / 150), m1 = Math.ceil((off + hgt + 160) / 150);
    for (let n = m0; n <= m1; n++) {
      const r = rng(n * 31337 + tr.k * 7 + 11), bx = tr.x + (r() - 0.5) * tr.w * 0.5, by = n * 150 - off, l = 60 + r() * 70;
      c.beginPath(); c.moveTo(bx, by); c.bezierCurveTo(bx + 4, by + l * 0.35, bx - 4, by + l * 0.7, bx + 2, by + l); c.stroke();
      if (r() < 0.3) { c.fillStyle = th.midDark; c.beginPath(); c.ellipse(tr.x + (r() - 0.5) * tr.w * 0.3, by + 40, 5, 9, 0, 0, TAU); c.fill(); }
    }
  }
}

// ---------- forest floor ----------
function drawGround(c, th, r, a, b, y, yb) {
  c.fillStyle = th.dirt[0]; c.strokeStyle = th.line; c.lineWidth = 3;
  c.beginPath(); c.moveTo(a, y + 4); c.lineTo(b, y + 4); c.lineTo(b, yb); c.lineTo(a, yb); c.closePath(); c.fill(); c.stroke();
  c.save(); c.beginPath(); c.rect(a, y, b - a, yb - y); c.clip();
  c.fillStyle = th.dirt[1];
  for (let i = 0; i < (b - a) / 9; i++) { c.beginPath(); c.ellipse(a + r() * (b - a), y + 26 + r() * 90, 2 + r() * 4, 1.5 + r() * 2.5, r(), 0, TAU); c.fill(); }
  c.fillStyle = th.dirt[2];
  for (let i = 0; i < (b - a) / 30; i++) { c.beginPath(); c.ellipse(a + r() * (b - a), y + 30 + r() * 70, 4 + r() * 4, 3 + r() * 2, 0, 0, TAU); c.fill(); c.strokeStyle = th.dirt[1]; c.lineWidth = 1.2; c.stroke(); }
  c.strokeStyle = th.dirt[1]; c.lineWidth = 2;
  for (let i = 0; i < (b - a) / 60; i++) { const rx = a + r() * (b - a); c.beginPath(); c.moveTo(rx, y + 12); c.bezierCurveTo(rx + 8, y + 26, rx - 6, y + 34, rx + 4, y + 48); c.stroke(); }
  c.restore();
  c.beginPath(); c.moveTo(a - 2, y + 12);
  for (let x = a - 2; x < b + 2; x += 10) c.quadraticCurveTo(x + 5, y + 18 + r() * 3, Math.min(x + 10, b + 2), y + 12);
  c.lineTo(b + 2, y - 2);
  for (let x = b + 2; x > a - 2; x -= 8) c.quadraticCurveTo(x - 4, y - 8 - r() * 5, Math.max(x - 8, a - 2), y - 2);
  c.closePath();
  c.fillStyle = th.grass[0]; c.fill(); c.strokeStyle = th.line; c.lineWidth = 3; c.stroke();
  c.strokeStyle = th.grass[1]; c.lineWidth = 2;
  for (let x = a + 4; x < b - 2; x += 7 + r() * 6) { c.beginPath(); c.moveTo(x, y + 6); c.lineTo(x + (r() - 0.5) * 4, y - 2 - r() * 6); c.stroke(); }
  for (let x = a + 20 + r() * 40; x < b - 14; x += 50 + r() * 70) {
    const fy = y - 6, pick = r();
    if (pick < 0.4) {
      c.fillStyle = '#fff8ea'; for (let k = 0; k < 5; k++) { const ang = (k / 5) * TAU; c.beginPath(); c.ellipse(x + Math.cos(ang) * 3.4, fy + Math.sin(ang) * 3.4, 2.6, 1.7, ang, 0, TAU); c.fill(); }
      c.fillStyle = '#ffcf3a'; c.beginPath(); c.arc(x, fy, 2, 0, TAU); c.fill();
    } else if (pick < 0.7) {
      c.strokeStyle = th.line; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x - 3, fy + 6); c.lineTo(x - 2, fy - 2); c.lineTo(x + 2, fy - 2); c.lineTo(x + 3, fy + 6); c.fillStyle = '#f6ead2'; c.fill(); c.stroke();
      c.beginPath(); c.ellipse(x, fy - 3, 7, 5, 0, Math.PI, 0); c.closePath(); c.fillStyle = '#e4523c'; c.fill(); c.stroke();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x - 2.5, fy - 5, 1.2, 0, TAU); c.arc(x + 2.6, fy - 4.4, 1, 0, TAU); c.fill();
    } else {
      c.fillStyle = th.grass[1]; c.strokeStyle = th.line; c.lineWidth = 1.2;
      for (let k = 0; k < 3; k++) { const ang = -Math.PI / 2 + (k - 1) * 0.9; c.beginPath(); c.arc(x + Math.cos(ang) * 3.5, fy + Math.sin(ang) * 3.5, 3.2, 0, TAU); c.fill(); c.stroke(); }
    }
  }
}

function drawHome(c, th, hx, hy, t) {

  }

  c.fillStyle = '#5f6a6e'; c.beginPath(); c.rect(hx + 11, hy - h - 21, 14, 5); c.fill(); c.stroke();
  c.fillStyle = '#6f3f21';
  c.beginPath(); c.moveTo(hx - w / 2 - 12, hy + 1); c.quadraticCurveTo(hx - w / 2, hy - 6, hx - w / 2 + 2, hy - 20); c.lineTo(hx + w / 2 - 2, hy - 20); c.quadraticCurveTo(hx + w / 2, hy - 6, hx + w / 2 + 12, hy + 1); c.closePath(); c.fill(); c.stroke();

  c.strokeStyle = 'rgba(40,20,8,.45)'; c.lineWidth = 2;

  c.strokeStyle = line; c.lineWidth = 3;
  c.beginPath(); c.ellipse(hx, hy - h, w / 2 - 3, 9, 0, 0, TAU); c.fillStyle = '#e8bb80'; c.fill(); c.stroke();
  c.strokeStyle = '#b8844e'; c.lineWidth = 1.4;

  door(); c.fillStyle = '#2a1408'; c.fill();
  c.save(); door(); c.clip();
  c.globalAlpha = 0.55 + Math.sin(t * 3) * 0.04; c.drawImage(glowOf('#ffc865'), hx - 30, hy - 40, 60, 60); c.globalAlpha = 1;
  c.restore();
  door(); c.strokeStyle = '#d9a066'; c.lineWidth = 3; c.stroke(); c.strokeStyle = line; c.lineWidth = 1.5; c.stroke();
  c.fillStyle = '#ffd877'; c.strokeStyle = line; c.lineWidth = 2.5;
  c.beginPath(); c.arc(hx + 18, hy - 52, 6, 0, TAU); c.fill(); c.stroke();
  c.lineWidth = 1.4; c.beginPath(); c.moveTo(hx + 12, hy - 52); c.lineTo(hx + 24, hy - 52); c.moveTo(hx + 18, hy - 58); c.lineTo(hx + 18, hy - 46); c.stroke();
  c.strokeStyle = line; c.lineWidth = 1.5; c.beginPath(); c.moveTo(hx - 24, hy - 50); c.lineTo(hx - 24, hy - 44); c.stroke();
  c.fillStyle = '#ffcf5a'; c.beginPath(); c.roundRect ? c.roundRect(hx - 28, hy - 44, 8, 10, 2) : c.rect(hx - 28, hy - 44, 8, 10); c.fill(); c.stroke();
}

function drawFloor(c, th, t) {
  if (G.run.camTop + VHW < -70) return;
  blobs(c, scene.bush, th.bush, th.line, 3);
  drawGround(c, th, rng(99), view.x0 - 10, view.x1 + 10, 0, 320);
  drawHome(c, th, 62, 1, t);
}

// ---------- footholds ----------
function drawBranch(c, th, q) {
  const r = rng(q.id * 977 + 13), hw = Core.BRANCH_H, y = q.y + hw + q.sq * 2.5, a = q.x - q.w / 2, b = q.x + q.w / 2;
  c.lineCap = 'round';
  c.strokeStyle = th.line; c.lineWidth = hw * 2 + 5; c.beginPath(); c.moveTo(a, y); c.lineTo(b, y); c.stroke();
  c.strokeStyle = th.branch[0]; c.lineWidth = hw * 2 - 1; c.stroke();
  c.strokeStyle = th.branch[1]; c.lineWidth = 3.2; c.beginPath(); c.moveTo(a + 6, y - 3.4); c.lineTo(b - 6, y - 3.4); c.stroke();
  c.strokeStyle = th.line; c.lineWidth = 1.6; c.globalAlpha = 0.45;
  for (let s = 14; s < q.w - 12; s += 20 + r() * 14) { c.beginPath(); c.moveTo(a + s, y + 2); c.lineTo(a + s + 8, y + 1); c.stroke(); }
  c.globalAlpha = 1;
  drawLeaf(c, a, y, Math.PI - 0.5, 8, th.canopy[2], th.line);
  drawLeaf(c, a, y, Math.PI + 0.5, 7, th.canopy[1], th.line);
  drawLeaf(c, b, y, -0.5, 8, th.canopy[2], th.line);
  drawLeaf(c, b, y, 0.5, 7, th.canopy[1], th.line);
}

function twigBody(c, th, a, b, y) {
  c.lineCap = 'round';
  c.beginPath(); c.moveTo(a, y); c.lineTo(b, y); c.moveTo(a + 8, y + 4); c.lineTo(b - 4, y - 2);
  c.strokeStyle = th.line; c.lineWidth = 8.5; c.stroke();
  c.strokeStyle = th.twig[0]; c.lineWidth = 4.5; c.stroke();
  c.beginPath(); c.moveTo(a + 4, y - 1.5); c.lineTo(b - 6, y - 1.5); c.strokeStyle = th.twig[1]; c.lineWidth = 1.4; c.stroke();
}
function drawTwig(c, th, q) {
  const y = q.y + 5, hw = q.w / 2;
  if (q.broken) {
    const k = clamp(q.fallT / 0.9, 0, 1);
    if (k >= 1) return;
    c.globalAlpha = 1 - k;
    for (const sd of [-1, 1]) {
      c.save(); c.translate(q.x + sd * (hw / 2 + k * 14), y); c.rotate(sd * k * 0.9);
      twigBody(c, th, -hw / 2, hw / 2 - 2, 0);
      c.restore();
    }
    c.globalAlpha = 1;
    return;
  }
  twigBody(c, th, q.x - hw, q.x + hw, y);
  // grass tie in the middle, and the crack it will break along
  c.strokeStyle = th.line; c.lineWidth = 6; c.beginPath(); c.moveTo(q.x - 3, y - 6); c.lineTo(q.x + 1, y + 6); c.stroke();
  c.strokeStyle = th.grass[0]; c.lineWidth = 3; c.stroke();
  c.strokeStyle = th.line; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(q.x + 10, y - 3); c.lineTo(q.x + 13, y); c.lineTo(q.x + 11, y + 3); c.stroke();
  c.beginPath(); c.moveTo(q.x - hw + 2, y); c.lineTo(q.x - hw - 5, y - 6); c.moveTo(q.x + hw - 2, y - 1); c.lineTo(q.x + hw + 5, y - 7); c.strokeStyle = th.line; c.lineWidth = 4; c.stroke();
  c.strokeStyle = th.twig[0]; c.lineWidth = 1.8; c.stroke();
}

function drawRaft(c, th, q, t) {
  const hw = q.w / 2, f = q.vx >= 0 ? 1 : -1;
  c.save(); c.translate(q.x, q.y + 6 + q.sq * 5); c.rotate(Math.sin(t * 2.2 + q.id) * 0.04); c.scale(f, 1);
  const shape = () => { c.beginPath(); c.moveTo(-hw, 0); c.quadraticCurveTo(-hw * 0.1, -14, hw, -2); c.quadraticCurveTo(hw * 0.05, 15, -hw, 0); c.closePath(); };
  shape(); c.fillStyle = th.raft[0]; c.fill();
  c.save(); shape(); c.clip();
  c.fillStyle = th.raft[1]; c.beginPath(); c.ellipse(-hw * 0.15, -6, hw * 0.75, 5, -0.05, 0, TAU); c.fill();
  c.restore();
  c.strokeStyle = th.raft[2]; c.lineWidth = 1.8; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-hw + 4, 0); c.quadraticCurveTo(0, -2, hw - 8, -2); c.stroke();
  c.lineWidth = 1.3;
  for (let k = 1; k < 5; k++) {
    const sx = -hw + (k * q.w) / 5.4;
    c.beginPath(); c.moveTo(sx, -1); c.lineTo(sx + 9, -8); c.moveTo(sx, -0.5); c.lineTo(sx + 9, 6); c.stroke();
  }
  shape(); c.strokeStyle = th.line; c.lineWidth = 2.6; c.stroke();
  c.beginPath(); c.moveTo(-hw, 0); c.quadraticCurveTo(-hw - 8, 1, -hw - 9, 7); c.quadraticCurveTo(-hw - 8, 11, -hw - 4, 10);
  c.strokeStyle = th.line; c.lineWidth = 4.5; c.stroke(); c.strokeStyle = th.raft[2]; c.lineWidth = 2; c.stroke();
  c.restore();
}

function drawShroom(c, th, sq) {
  const capW = 36 * (1 + sq * 0.2), capH = 30 * (1 - sq * 0.32), cy = -24 + sq * 5;
  c.lineWidth = 3; c.strokeStyle = th.line; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-9, 1); c.quadraticCurveTo(-10, cy + 6, -7, cy); c.lineTo(7, cy); c.quadraticCurveTo(10, cy + 6, 9, 1); c.closePath();
  c.fillStyle = '#f5e7cb'; c.fill(); c.stroke();
  if (sq > 0.02) { c.globalAlpha = sq * 0.8; c.drawImage(glowOf('#c25be0'), -60, cy - 70, 120, 120); c.globalAlpha = 1; }
  const cap = () => { c.beginPath(); c.moveTo(-capW, cy); c.bezierCurveTo(-capW, cy - capH * 1.3, capW, cy - capH * 1.3, capW, cy); c.quadraticCurveTo(0, cy + 9, -capW, cy); c.closePath(); };
  cap(); c.fillStyle = th.shroom[0]; c.fill();
  c.save(); cap(); c.clip();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(-capW * 0.3, cy - capH * 0.7, capW * 0.45, capH * 0.35, -0.3, 0, TAU); c.fill();
  c.fillStyle = th.shroom[1];
  for (const [ox, oy, rr] of [[-0.5, -0.45, 5.5], [0.1, -0.8, 6.5], [0.55, -0.4, 4.6], [-0.15, -0.25, 3.4]]) { c.beginPath(); c.arc(ox * capW, cy + oy * capH, rr, 0, TAU); c.fill(); }
  c.restore();
  cap(); c.strokeStyle = th.line; c.lineWidth = 3; c.stroke();
}
function drawCap(c, th, q) {
  drawBranch(c, th, q);
  c.save(); c.translate(q.x, q.y + 1); c.scale(0.82, 0.82); drawShroom(c, th, q.sq); c.restore();
}

// ---------- pickups and hazards ----------
function drawBerry(c, x, y, t, i, night) {
  const by = y + Math.sin(t * 2.4 + i * 1.7) * 3;
  c.globalAlpha = night ? 0.7 : 0.45; c.drawImage(glowOf(night ? '#ffb0bc' : '#fff6c0'), x - 24, by - 24, 48, 48); c.globalAlpha = 1;
  const d = [[-4, -2], [4, -2], [-5.5, 4], [5.5, 4], [0, 9], [0, 2.5]];
  c.fillStyle = '#4a0f1c';
  c.beginPath(); for (const [ox, oy] of d) { c.moveTo(x + ox + 6.2, by + oy); c.arc(x + ox, by + oy, 6.2, 0, TAU); } c.fill();
  c.fillStyle = '#e2384f';
  c.beginPath(); for (const [ox, oy] of d) { c.moveTo(x + ox + 4.6, by + oy); c.arc(x + ox, by + oy, 4.6, 0, TAU); } c.fill();
  c.fillStyle = '#ff9aa6';
  c.beginPath(); for (const [ox, oy] of d) { c.moveTo(x + ox - 1 + 1.4, by + oy - 1.6); c.arc(x + ox - 1, by + oy - 1.6, 1.4, 0, TAU); } c.fill();
  drawLeaf(c, x, by - 6, -Math.PI / 2 - 0.9, 5.5, '#5cb536');
  drawLeaf(c, x, by - 6, -Math.PI / 2 + 0.9, 5.5, '#5cb536');
}

// stalk from (x, baseY) up to a seed head; also what he hangs from while floating
function drawDandelion(c, x, baseY, topY, t, glowOn) {
  const sway = Math.sin(t * 1.6) * 4, tx = x + sway;
  c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, baseY); c.quadraticCurveTo(x + sway * 0.2, (baseY + topY) / 2, tx, topY);
  c.strokeStyle = '#1f3013'; c.lineWidth = 4.5; c.stroke(); c.strokeStyle = '#7cc04a'; c.lineWidth = 2.2; c.stroke();
  c.save(); c.translate(tx, topY);
  if (glowOn) { c.globalAlpha = 0.5 + 0.2 * Math.sin(t * 4); c.drawImage(glowOf('#ffffff'), -34, -34, 68, 68); c.globalAlpha = 1; }
  c.fillStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.arc(0, 0, 17, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(40,40,20,.28)'; c.lineWidth = 1.2; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 1; c.fillStyle = '#fff';
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * TAU + Math.sin(t * 1.3 + i) * 0.05, ex = Math.cos(a) * 15, ey = Math.sin(a) * 15;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(ex, ey); c.stroke();
    c.beginPath(); c.arc(ex * 1.04, ey * 1.04, 1.7, 0, TAU); c.fill();
  }
  c.fillStyle = '#c9b27a'; c.beginPath(); c.arc(0, 0, 3, 0, TAU); c.fill();
  c.restore();
}

function drawThorns(c, th, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, nx = -uy, ny = ux;
  const at = (s) => { const o = Math.sin(s * 0.21) * 2.6; return [ax + ux * s + nx * o, ay + uy * s + ny * o]; };
  c.lineJoin = 'round';
  for (let s = 6, k = 0; s < l - 3; s += 9, k++) {
    const side = k % 2 ? 1 : -1, [px, py] = at(s);
    c.beginPath();
    c.moveTo(px - ux * 3.4, py - uy * 3.4);
    c.lineTo(px + nx * side * 12 + ux * 3, py + ny * side * 12 + uy * 3);
    c.lineTo(px + ux * 3.4, py + uy * 3.4); c.closePath();
    c.fillStyle = '#f2e3d6'; c.fill(); c.strokeStyle = th.line; c.lineWidth = 1.6; c.stroke();
  }
  c.beginPath();
  for (let s = 0; s <= l; s += 4) { const [px, py] = at(s); s ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.lineCap = 'round';
  c.strokeStyle = th.line; c.lineWidth = 9; c.stroke();
  c.strokeStyle = '#6e2944'; c.lineWidth = 5.5; c.stroke();
  c.strokeStyle = '#a24a6a'; c.lineWidth = 1.6; c.stroke();
}

function drawWasp(c, th, z, t) {
  const f = z.vx >= 0 ? 1 : -1, flap = Math.sin(t * 46 + z.ph) * 0.5;
  c.save(); c.translate(z.x, z.yy); c.scale(f, 1);
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.fillStyle = 'rgba(235,248,255,.78)'; c.strokeStyle = th.line; c.lineWidth = 1.6;
  for (const [ox, rot] of [[-4, -0.9 - flap], [2, -0.45 + flap]]) {
    c.save(); c.translate(ox, -6); c.rotate(rot); c.beginPath(); c.ellipse(0, -8, 5, 9.5, 0, 0, TAU); c.fill(); c.stroke(); c.restore();
  }
  c.fillStyle = th.line; c.beginPath(); c.moveTo(-13, 0); c.lineTo(-21, 3.5); c.lineTo(-13, 6); c.closePath(); c.fill();
  const body = () => { c.beginPath(); c.ellipse(-3, 3, 12.5, 9, 0, 0, TAU); };
  body(); c.fillStyle = '#ffcc33'; c.fill();
  c.save(); body(); c.clip();
  c.fillStyle = '#2b1709'; for (const sx of [-11, -4.5]) c.fillRect(sx, -8, 3.6, 22);
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-2, -1.5, 8, 3, 0, 0, TAU); c.fill();
  c.restore();
  body(); c.strokeStyle = th.line; c.lineWidth = 2.4; c.stroke();
  c.beginPath(); c.arc(10, 0, 7, 0, TAU); c.fillStyle = '#ffcc33'; c.fill(); c.stroke();
  c.fillStyle = th.line; c.beginPath(); c.arc(12, -0.5, 2, 0, TAU); c.fill();
  c.strokeStyle = th.line; c.lineWidth = 1.8;
  c.beginPath(); c.moveTo(9, -4.5); c.lineTo(14.5, -2.5); c.stroke();
  c.beginPath(); c.moveTo(9, -6); c.quadraticCurveTo(11, -13, 16, -13); c.moveTo(7, -6.5); c.quadraticCurveTo(6, -13, 10, -15); c.stroke();
  c.restore();
}

function drawDraft(c, z, t) {
  const { x, y, w, h } = z;
  c.save();
  c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, 18) : c.rect(x, y, w, h);
  c.fillStyle = 'rgba(255,255,255,0.12)'; c.fill();
  c.setLineDash([10, 8]); c.lineDashOffset = -t * 30; c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 2.6; c.stroke(); c.setLineDash([]);
  c.clip();
  c.lineCap = 'round'; c.lineJoin = 'round';
  const cx = x + w / 2;
  for (let k = 0; k * 64 < h + 64; k++) {
    const pos = ((t * 70 + k * 64) % (h + 64)) - 32, cy = y + h - pos;
    const fade = Math.sin(clamp((pos + 32) / (h + 64), 0, 1) * Math.PI);
    c.strokeStyle = `rgba(255,255,255,${0.7 * fade})`; c.lineWidth = 4;
    c.beginPath(); c.moveTo(cx - 11, cy + 6); c.lineTo(cx, cy - 6); c.lineTo(cx + 11, cy + 6); c.stroke();
  }
  const n = Math.round(w / 18);
  for (let i = 0; i < n; i++) {
    const off = ((i * 0.37) % 1) * h, pos = ((t * 217 + off + i * 41) % (h + 60)) - 30;
    const sx = x + (i + 0.5) * (w / n) + Math.sin(t * 2 + i) * 4, sy = y + h - pos, len = 22 + (i % 3) * 8;
    c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(sx - 4, sy + len * 0.5, sx, sy + len); c.stroke();
  }
  c.restore();
}

// a dashed line and a little peg sign where the best run topped out
function drawBestMark(c, th, camTop) {
  if (G.prevBest <= 0 || G.mode === 'idle') return;
  const y = -G.prevBest * M;
  if (y < camTop - 40 || y > camTop + VHW + 40) return;
  c.save();
  c.setLineDash([3, 11]); c.lineCap = 'round'; c.strokeStyle = 'rgba(255,243,209,.7)'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(4, y); c.lineTo(W - 4, y); c.stroke(); c.setLineDash([]);
  const label = `BEST ${G.prevBest} m`;
  c.font = '14px "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif';
  const tw = c.measureText(label).width, bw = tw + 20, bx = W - bw - 10, by = y - 30;
  c.strokeStyle = th.line; c.lineWidth = 2.5; c.beginPath(); c.moveTo(bx + bw / 2, by + 22); c.lineTo(bx + bw / 2, y); c.stroke();
  const gr = c.createLinearGradient(0, by, 0, by + 22);
  gr.addColorStop(0, '#dc9d5c'); gr.addColorStop(1, '#9a5a28');
  c.beginPath(); c.roundRect ? c.roundRect(bx, by, bw, 22, 6) : c.rect(bx, by, bw, 22);
  c.fillStyle = gr; c.fill(); c.strokeStyle = '#4a2812'; c.lineWidth = 2.5; c.stroke();
  c.fillStyle = '#4a2812'; c.fillText(label, bx + 10, by + 17.5);
  c.fillStyle = '#fff3d1'; c.fillText(label, bx + 10, by + 16);
  c.restore();
}

// shade the strips outside the play column on wide screens, with a vine marking each edge
function drawEdges(c, th, camTop) {
  if (view.x0 > -2) return;
  const top = camTop - 10, hgt = VHW + 20;
  c.fillStyle = 'rgba(16,26,10,.42)';
  c.fillRect(view.x0, top, -view.x0, hgt); c.fillRect(W, top, view.x1 - W, hgt);
  for (const ex of [0, W]) {
    const sd = ex ? 1 : -1;
    c.beginPath();
    for (let y = top; y <= top + hgt; y += 12) { const x = ex + sd * 3 + Math.sin(y * 0.05) * 3; y === top ? c.moveTo(x, y) : c.lineTo(x, y); }
    c.lineCap = 'round'; c.strokeStyle = th.line; c.lineWidth = 7; c.stroke(); c.strokeStyle = th.canopy[1]; c.lineWidth = 3.5; c.stroke();
    for (let y = Math.floor(top / 46) * 46; y < top + hgt; y += 46) {
      const k = Math.round(y / 46) & 1, x = ex + sd * 3 + Math.sin(y * 0.05) * 3;
      drawLeaf(c, x, y, k ? Math.PI * 0.2 * sd + (sd < 0 ? Math.PI : 0) : (sd < 0 ? Math.PI : 0) - Math.PI * 0.25 * sd, 7, th.canopy[2], th.line);
    }
  }
}

// ---------- the hedgehog ----------
function drawHog(c, x, y, o) {
  const line = '#2b1709', curl = o.mood === 'curl', lk = o.look || 0;
  c.save(); c.translate(x, y + R); c.scale(o.sx, o.sy); c.translate(0, -R); c.rotate(o.ang);
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath();
  const n = 15;
  for (let i = 0; i < n * 2; i++) {
    const a = (i / (n * 2)) * TAU - Math.PI / 2, rr = i % 2 === 0 ? R + 5.5 : R - 0.5;
    i ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  c.closePath(); c.fillStyle = '#5c3820'; c.fill(); c.lineWidth = 2.4; c.strokeStyle = line; c.stroke();
  c.beginPath(); c.arc(0, 0, R - 2.5, 0, TAU); c.fillStyle = '#8b5a35'; c.fill();
  c.strokeStyle = '#6a4127'; c.lineWidth = 1.7;
  for (let i = 0; i < 9; i++) { const a = (i / 9) * TAU + 0.3; c.beginPath(); c.moveTo(Math.cos(a) * (R - 10), Math.sin(a) * (R - 10)); c.lineTo(Math.cos(a + 0.28) * (R - 3.5), Math.sin(a + 0.28) * (R - 3.5)); c.stroke(); }
  if (!curl) {
    c.fillStyle = '#f3d3a0'; c.strokeStyle = line; c.lineWidth = 1.6;
    for (const fx of [-6.5, 6.5]) { c.beginPath(); c.ellipse(fx + lk * 0.6, R - 1.5 + (o.tuck || 0), 4.6, 3.1, 0, 0, TAU); c.fill(); c.stroke(); }
  }
  c.beginPath(); c.ellipse(lk, 4, 10.5, 9, 0, 0, TAU); c.fillStyle = '#f3d3a0'; c.fill(); c.lineWidth = 1.8; c.strokeStyle = line; c.stroke();
  c.fillStyle = line; c.strokeStyle = line; c.lineWidth = 1.8;
  const ex1 = -4 + lk, ex2 = 4 + lk;
  if (o.mood === 'idle' && ((o.t || 0) % 3.4) > 0.14) {
    c.beginPath(); c.arc(ex1, 2, 2, 0, TAU); c.arc(ex2, 2, 2, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex1 + 0.6, 1.3, 0.7, 0, TAU); c.arc(ex2 + 0.6, 1.3, 0.7, 0, TAU); c.fill();
  } else if (o.mood === 'ouch') {
    for (const ex of [ex1, ex2]) { c.beginPath(); c.moveTo(ex - 2, 0); c.lineTo(ex + 2, 4); c.moveTo(ex + 2, 0); c.lineTo(ex - 2, 4); c.stroke(); }
  } else if (o.mood === 'happy') {
    for (const ex of [ex1, ex2]) { c.beginPath(); c.arc(ex, 3, 2.3, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
  } else {
    for (const ex of [ex1, ex2]) { c.beginPath(); c.moveTo(ex - 2.2, 2); c.lineTo(ex + 2.2, 2); c.stroke(); }
  }
  c.beginPath(); c.arc(lk * 1.3, 7, 2.2, 0, TAU); c.fillStyle = line; c.fill();
  c.fillStyle = 'rgba(240,110,110,.5)'; c.beginPath(); c.arc(-7.2 + lk, 6.5, 2.2, 0, TAU); c.arc(7.2 + lk, 6.5, 2.2, 0, TAU); c.fill();
  if (!curl) {
    c.fillStyle = '#f3d3a0'; c.strokeStyle = line; c.lineWidth = 1.6;
    c.beginPath(); c.ellipse(-3.4 + lk * 0.5, -R + 2, 3, 2.4, 0, 0, TAU); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(3.4 + lk * 0.5, -R + 2, 3, 2.4, 0, 0, TAU); c.fill(); c.stroke();
  }
  c.restore();
}

function hogPose(p, t) {
  const e = p.sq * p.sq, st = clamp(-p.vy / Core.JUMP, 0, 1.2) * 0.1 * (1 - e);
  let mood = G.happyT > 0 || p.float > 0 ? 'happy' : 'idle';
  let ang = clamp(p.vx / Core.VX, -1, 1) * 0.16;
  if (p.flip > 0) { mood = 'curl'; ang = p.flip * TAU * (p.face || 1); }
  return { ang, mood, sx: 1 + 0.28 * e - st * 0.6, sy: 1 - 0.26 * e + st, look: clamp(p.vx / Core.VX, -1, 1) * 1.6, tuck: p.vy > 0 ? 1.5 : -0.5, t };
}

// draws him, plus a twin across the seam when he is wrapping around an edge
function drawWrapped(x, fn) {
  fn(x);
  if (x < R + 8) fn(x + W);
  else if (x > W - R - 8) fn(x - W);
}

// ---------- effects ----------
function drawFx(c, th, dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const p = G.fx[i];
    p.life += dt;
    if (p.life >= p.max) { G.fx.splice(i, 1); continue; }
    const k = p.life / p.max;
    if (p.kind === 'chip') { p.vy += 900 * dt; p.rot += p.spin * dt; }
    else if (p.kind === 'seed') { p.vx += Math.sin(p.life * 3 + p.rot) * 30 * dt; p.vy -= 6 * dt; }
    else if (p.kind === 'heart') { p.vy -= 30 * dt; }
    else { p.vx *= 1 - 3 * dt; p.vy *= 1 - 3 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    c.globalAlpha = 1 - k;
    if (p.kind === 'seed') {
      c.strokeStyle = '#fff'; c.lineWidth = 1; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x, p.y + 7); c.stroke();
      for (let a = -2; a <= 2; a++) { c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x + a * 2.2, p.y - 4); c.stroke(); }
    } else if (p.kind === 'puff') {
      c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(p.x, p.y, 4 + k * 10, 0, TAU); c.fill();
    } else if (p.kind === 'spark') {
      c.fillStyle = p.color || '#fff6a8'; const s = 6 * (1 - k) + 2;
      c.beginPath(); c.moveTo(p.x, p.y - s); c.lineTo(p.x + s * 0.3, p.y - s * 0.3); c.lineTo(p.x + s, p.y); c.lineTo(p.x + s * 0.3, p.y + s * 0.3); c.lineTo(p.x, p.y + s); c.lineTo(p.x - s * 0.3, p.y + s * 0.3); c.lineTo(p.x - s, p.y); c.lineTo(p.x - s * 0.3, p.y - s * 0.3); c.closePath(); c.fill();
    } else if (p.kind === 'heart') {
      const s = 6 + k * 3; c.fillStyle = '#ff6b86';
      c.beginPath(); c.moveTo(p.x, p.y + s * 0.8); c.bezierCurveTo(p.x - s * 1.4, p.y - s * 0.2, p.x - s * 0.6, p.y - s * 1.2, p.x, p.y - s * 0.4); c.bezierCurveTo(p.x + s * 0.6, p.y - s * 1.2, p.x + s * 1.4, p.y - s * 0.2, p.x, p.y + s * 0.8); c.fill();
    } else if (p.kind === 'dust') {
      c.fillStyle = 'rgba(240,226,200,.8)'; c.beginPath(); c.arc(p.x, p.y, 2 + k * 5, 0, TAU); c.fill();
    } else if (p.kind === 'chip') {
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.strokeStyle = th.line; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(-4, 0); c.lineTo(4, 0); c.stroke();
      c.strokeStyle = th.twig[0]; c.lineWidth = 2; c.stroke();
      c.restore();
    }
    c.globalAlpha = 1;
  }
}
function burst(kind, x, y, n, speed, max, color) {
  for (let k = 0; k < n; k++) {
    const a = (k / n) * TAU + Math.random() * 0.3;
    G.fx.push({ kind, x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 0, max, color, rot: a, spin: (Math.random() - 0.5) * 14 });
  }
}
function seeds(x, y, n) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * TAU;
    G.fx.push({ kind: 'seed', x: x + Math.cos(a) * 12, y: y + Math.sin(a) * 12, vx: Math.cos(a) * 50, vy: -20 - Math.random() * 60, life: 0, max: 1.8 + Math.random(), rot: a });
  }
}

function handleEvents() {
  const run = G.run, ev = run.events;
  for (const e of ev) {
    if (e.type === 'hop') {
      if (e.kind === 'raft') sfx.leaf(); else sfx.hop();
      for (let k = 0; k < 3; k++) G.fx.push({ kind: 'dust', x: e.x + (Math.random() - 0.5) * 16, y: e.y, vx: (Math.random() - 0.5) * 110, vy: -Math.random() * 40, life: 0, max: 0.4 });
    } else if (e.type === 'snap') {
      sfx.snap(); buzz(12);
      burst('chip', e.x, e.y + 4, 8, 120, 0.7);
    } else if (e.type === 'boing') {
      sfx.boing(); buzz(15);
      burst('spark', e.x, e.y, 10, 150, 0.5, '#f4d7f6');
    } else if (e.type === 'berry') {
      sfx.berry(); buzz(10); G.happyT = 0.6;
      burst('spark', e.x, e.y, 10, 120, 0.5);
      G.fx[G.fx.length - 1].color = '#ff9aa6';
    } else if (e.type === 'pop') {
      sfx.pop(); buzz(20); G.happyT = 0.6;
      burst('puff', e.x, e.y, 10, 140, 0.55);
      burst('spark', e.x, e.y, 8, 170, 0.5, '#ffcc33');
    } else if (e.type === 'puff') {
      sfx.puff(); buzz(15);
      seeds(e.x, e.y - 46, 10);
    } else if (e.type === 'puffEnd') {
      seeds(run.p.x, run.p.y - R - 42, 18);
    } else if (e.type === 'draft') {
      sfx.whoosh();
    }
  }
  ev.length = 0;
}

// ---------- frame ----------
let T = 0, last = performance.now(), acc = 0, lastCam = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const run = G.run;
  if (!G.paused) {
    T += dt;
    if (G.mode === 'run') {
      const dir = steerDir();
      if (dir && !G.steered) { G.steered = true; clearTimeout(hintTimer); hintTimer = setTimeout(() => hint.classList.add('gone'), 1200); }
      $('pad-l').classList.toggle('on', dir < 0); $('pad-r').classList.toggle('on', dir > 0);
      acc += dt;
      const h = 1 / 240; let n = 0;
      while (acc >= h && n < 16 && !run.result) { Core.step(run, h, dir); acc -= h; n++; }
      if (n >= 16) acc = 0;
      handleEvents();
      updateHud();
      if (run.p.float > 0) { G.seedT -= dt; if (G.seedT <= 0) { G.seedT = 0.07; seeds(run.p.x, run.p.y - R - 42, 1); } }
      if (run.result) onEnd(run.result);
    } else if (G.mode === 'over') {
      G.overT += dt;
      const f = G.fall;
      f.vy += Core.GRAV * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.ang += f.spin * dt;
      if (G.overT > (G.cause === 'fall' ? 0.55 : 1.1) && G.screen === 'play') showResult();
    }
    G.happyT = Math.max(0, G.happyT - dt);
  }
  const th = themeAt(-(run.camTop + VHW * 0.5));
  if (!G.paused && !reduceMotion) updateMotes(dt, run.camTop - lastCam, th);
  lastCam = run.camTop;
  render(G.paused ? 0 : dt, th);
  requestAnimationFrame(frame);
}

function render(dt, th) {
  const run = G.run, c = ctx, t = T, cam = run.camTop;
  c.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, 0);
  drawSky(c, th, t);
  drawTrunks(c, th, cam);
  c.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, -DPR * S * cam);
  drawFloor(c, th, t);
  c.save();
  if (view.x0 < -2) { c.beginPath(); c.rect(0, cam - 60, W, VHW + 120); c.clip(); }
  for (const z of run.drafts) drawDraft(c, z, t);
  drawBestMark(c, th, cam);
  for (const q of run.plats) {
    if (q.y < cam - 80 || q.y > cam + VHW + 80) continue;
    if (q.kind === 'branch') drawBranch(c, th, q);
    else if (q.kind === 'twig') drawTwig(c, th, q);
    else if (q.kind === 'raft') drawRaft(c, th, q, t);
    else if (q.kind === 'cap') drawCap(c, th, q);
  }
  run.items.forEach((it, i) => {
    if (it.got || it.y < cam - 80 || it.y > cam + VHW + 80) return;
    if (it.kind === 'berry') drawBerry(c, it.x, it.y, t, i, th.night > 0.5);
    else drawDandelion(c, it.x, it.y, it.y - 46, t, true);
  });
  for (const z of run.haz) {
    if (z.y < cam - 80 || z.y > cam + VHW + 80) continue;
    if (z.kind === 'bramble') drawWrapped(z.x, (x) => drawThorns(c, th, x - z.w / 2, z.y, x + z.w / 2, z.y));
    else if (!z.dead) drawWasp(c, th, z, t);
  }
  const p = run.p;
  if (G.mode === 'idle') {
    // a small hop in place at the front door while the title is up
    const ph = reduceMotion ? 0.5 : (t * 1.15) % 1, hop = 4 * ph * (1 - ph) * 22, land = ph < 0.1 ? 1 - ph / 0.1 : ph > 0.92 ? (ph - 0.92) / 0.08 : 0;
    drawHog(c, p.x, p.y - hop, { ang: 0, mood: 'idle', sx: 1 + 0.18 * land, sy: 1 - 0.16 * land, look: 0, tuck: 0, t });
  } else if (G.mode === 'run') {
    const pose = hogPose(p, t);
    drawWrapped(p.x, (x) => {
      if (p.float > 0) drawDandelion(c, x, p.y - R + 3, p.y - R - 42, t, false);
      drawHog(c, x, p.y, pose);
    });
  } else if (G.mode === 'over') {
    const f = G.fall;
    drawHog(c, f.x, f.y, { ang: f.ang, mood: 'ouch', sx: 1, sy: 1, look: 0, tuck: 1.5, t });
  }
  drawFx(c, th, dt);
  c.restore();
  drawEdges(c, th, cam);
  c.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, 0);
  drawMotes(c, th);
}

// ---------- buttons ----------
$('btn-play').addEventListener('click', () => { audio(); startRun(); });
$('btn-again').addEventListener('click', () => { audio(); newRun(); startRun(); });
$('btn-home').addEventListener('click', () => { newRun(); show('title'); });
$('btn-pause').addEventListener('click', () => setPaused(true));
$('btn-resume').addEventListener('click', () => { audio(); setPaused(false); });
$('btn-quit').addEventListener('click', () => { G.paused = false; newRun(); show('title'); });
function syncSound() {
  for (const u of document.querySelectorAll('.sound-use')) u.setAttribute('href', soundOn ? '#i-sound' : '#i-mute');
  for (const id of ['btn-sound', 'btn-sound2']) $(id).setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
}
for (const id of ['btn-sound', 'btn-sound2']) {
  $(id).addEventListener('click', () => { soundOn = !soundOn; store.set('hedgehop.sound', soundOn); syncSound(); if (soundOn) sfx.berry(); });
}
$('title-tip').textContent = STEER_TEXT;

// ---------- boot ----------
function start(data) {
  newRun();
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app); else window.addEventListener('resize', resize);
  syncSound(); initMotes();
  if (data && data.run && data.mode === 'run' && !data.run.result) {
    // a page update mid-climb picks up where he was, paused
    G.run = data.run; G.run.viewH = VHW; G.mode = 'run'; G.prevBest = data.prevBest || best; G.bestToast = !!data.bestToast;
    show('play'); resetHud(); setPaused(true);
  } else show('title');
  lastCam = G.run.camTop;
  requestAnimationFrame((now) => { last = now; requestAnimationFrame(frame); });
}
window.claude?.hot?.snapshot?.(() => ({ mode: G.mode, run: G.mode === 'run' ? G.run : null, prevBest: G.prevBest, bestToast: G.bestToast }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
